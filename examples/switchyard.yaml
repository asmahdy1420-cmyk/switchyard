# switchyard example configuration
listen: ":8080"
admin_listen: ":9090"
shutdown_timeout: 15s
log_format: json
max_retry_body: 1048576   # bodies up to 1 MiB are buffered so retries can replay them

pools:
  api:
    strategy: least_connections
    upstreams:
      - url: http://127.0.0.1:9001
      - url: http://127.0.0.1:9002
    health_check:
      path: /healthz
      interval: 5s
      timeout: 1s
      healthy_threshold: 2
      unhealthy_threshold: 3
    passive:
      max_failures: 5
      ejection_time: 30s

  sessions:
    strategy: consistent_hash
    hash_key: header:X-User-ID   # falls back to client IP when the header is absent
    virtual_nodes: 160
    upstreams:
      - url: http://127.0.0.1:9101
      - url: http://127.0.0.1:9102
      - url: http://127.0.0.1:9103

  static:
    strategy: weighted
    upstreams:
      - url: http://127.0.0.1:9201
        weight: 3
      - url: http://127.0.0.1:9202
        weight: 1

routes:
  - name: api
    host: api.example.com
    path_prefix: /v1
    pool: api
    timeout: 10s
    retries: 2

  - name: sessions
    path_prefix: /session
    pool: sessions
    timeout: 5s
    strip_prefix: true

  - name: default
    pool: static
    timeout: 30s
    retries: 1
